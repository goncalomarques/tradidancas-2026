<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradidanças 2026 — Programa</title>
  <meta name="description" content="Programa interativo não oficial do festival Tradidanças 2026 (29 Julho a 2 Agosto). Oficinas, concertos, bailes, conversas e viagens.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Design Tokens ─────────────────────────────────────────── */
    :root {
      --primary: #c97d14;
      --primary-bg: rgba(201, 125, 20, 0.12);
      --primary-border: rgba(201, 125, 20, 0.4);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    /* ─── Dark Mode (default) ────────────────────────────────────── */
    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-subtle: #161b22;
      --bg-card: rgba(22, 27, 34, 0.85);
      --bg-card-hover: rgba(33, 38, 48, 0.9);
      --bg-header: rgba(13, 17, 23, 0.88);
      --text: #e6edf3;
      --text-muted: #7d8590;
      --text-faint: #484f58;
      --border: rgba(240, 246, 252, 0.1);
      --border-hover: rgba(201, 125, 20, 0.5);
      --input-bg: rgba(22, 27, 34, 0.7);
      --disclaimer-bg: rgba(218, 54, 51, 0.12);
      --disclaimer-border: rgba(218, 54, 51, 0.3);
      --disclaimer-text: #f8827b;
      --past-opacity: 0.38;
      --current-glow: rgba(201, 125, 20, 0.25);
    }

    /* ─── Light Mode ─────────────────────────────────────────────── */
    [data-theme="light"] {
      --bg: #f6f8fa;
      --bg-subtle: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: rgba(246, 248, 250, 1);
      --bg-header: rgba(255, 255, 255, 0.92);
      --text: #1f2328;
      --text-muted: #57606a;
      --text-faint: #8c959f;
      --border: rgba(31, 35, 40, 0.12);
      --border-hover: rgba(201, 125, 20, 0.5);
      --input-bg: rgba(255, 255, 255, 0.85);
      --disclaimer-bg: rgba(218, 54, 51, 0.07);
      --disclaimer-border: rgba(218, 54, 51, 0.25);
      --disclaimer-text: #a0201b;
      --past-opacity: 0.4;
      --current-glow: rgba(201, 125, 20, 0.12);
    }

    /* ─── System preference fallback ─────────────────────────────── */
    @media (prefers-color-scheme: light) {
      html:not([data-theme]) {
        --bg: #f6f8fa;
        --bg-subtle: #ffffff;
        --bg-card: rgba(255, 255, 255, 0.9);
        --bg-card-hover: rgba(246, 248, 250, 1);
        --bg-header: rgba(255, 255, 255, 0.92);
        --text: #1f2328;
        --text-muted: #57606a;
        --text-faint: #8c959f;
        --border: rgba(31, 35, 40, 0.12);
        --border-hover: rgba(201, 125, 20, 0.5);
        --input-bg: rgba(255, 255, 255, 0.85);
        --disclaimer-bg: rgba(218, 54, 51, 0.07);
        --disclaimer-border: rgba(218, 54, 51, 0.25);
        --disclaimer-text: #a0201b;
        --past-opacity: 0.4;
        --current-glow: rgba(201, 125, 20, 0.12);
      }
    }

    /* ─── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── Base ────────────────────────────────────────────────────── */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      transition: background 0.3s, color 0.3s;
    }

    /* ─── Header ─────────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-header);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }

    /* Single-color logo */
    .brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--primary);
      line-height: 1;
    }

    .brand .dates {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Theme toggle */
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 700;
    }

    .btn-primary:hover {
      background: #b36c10;
      border-color: #b36c10;
      color: #fff;
      transform: translateY(-1px);
    }

    /* ─── Main ────────────────────────────────────────────────────── */
    main {
      max-width: 900px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
    }

    /* ─── Disclaimer ─────────────────────────────────────────────── */
    .disclaimer-banner {
      background: var(--disclaimer-bg);
      border: 1px solid var(--disclaimer-border);
      color: var(--disclaimer-text);
      padding: 0.7rem 1.1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      font-size: 0.83rem;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .disclaimer-banner svg { flex-shrink: 0; margin-top: 1px; }

    .disclaimer-banner a {
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
    }

    /* ─── Controls ────────────────────────────────────────────────── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .search-bar {
      position: relative;
    }

    .search-bar input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.8rem 1.1rem 0.8rem 2.75rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input::placeholder { color: var(--text-faint); }
    .search-bar input:focus { border-color: var(--primary); }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }

    .filter-tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .sub-filters {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .select-filter {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
      flex: 1;
      min-width: 150px;
      transition: border-color 0.2s;
    }

    .select-filter:focus { border-color: var(--primary); }

    /* ─── Stats bar ───────────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      color: var(--text-faint);
      font-size: 0.8rem;
    }

    /* ─── Events list ─────────────────────────────────────────────── */
    .events-grid {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .event-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.1rem 1.1rem 1.4rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s, filter 0.2s;
    }

    .event-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
    }

    /* Category accent strip */
    .event-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      background: var(--primary);
    }

    .event-card[data-cat*="Dança"]::before       { background: #c97d14; }
    .event-card[data-cat*="Concertos"]::before   { background: #b04a80; }
    .event-card[data-cat*="Bailes"]::before      { background: #6d4fc9; }
    .event-card[data-cat*="ELI"]::before         { background: #1a7f52; }
    .event-card[data-cat*="Desenvolvimento"]::before { background: #1473a8; }
    .event-card[data-cat*="Instrumentos"]::before{ background: #c45c10; }
    .event-card[data-cat*="Conversas"]::before   { background: #2058c2; }
    .event-card[data-cat*="Igreja"]::before      { background: #a08200; }
    .event-card[data-cat*="Tradição"]::before    { background: #4a7c1a; }
    .event-card[data-cat*="Viagens"]::before     { background: #107870; }

    /* Past events */
    .event-card.is-past {
      opacity: var(--past-opacity);
      filter: grayscale(80%);
    }
    .event-card.is-past:hover {
      opacity: 0.7;
      filter: grayscale(30%);
    }

    /* Current / live events */
    .event-card.is-current {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary-border), 0 4px 20px var(--current-glow);
    }

    /* ─── Card internals ──────────────────────────────────────────── */
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }

    .event-time {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .live-badge {
      font-size: 0.65rem;
      font-weight: 800;
      color: #fff;
      background: var(--primary);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .event-date-badge {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-faint);
    }

    .event-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .toggle-icon {
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-top: 0.2rem;
      transition: transform 0.25s ease, color 0.2s;
    }

    .event-card.expanded .toggle-icon {
      transform: rotate(180deg);
      color: var(--primary);
    }

    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.6rem;
      font-size: 0.78rem;
    }

    .event-location {
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .event-cat {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      color: var(--text-faint);
      font-size: 0.72rem;
    }

    /* ─── Expandable description ──────────────────────────────────── */
    .event-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.28s ease, padding 0.28s ease, margin 0.28s ease;
    }

    .event-card.expanded .event-desc {
      max-height: 1200px;
      opacity: 1;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
    }

    .official-link {
      margin-top: 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .official-link:hover { text-decoration: underline; }

    /* ─── Empty state ─────────────────────────────────────────────── */
    .no-results {
      text-align: center;
      padding: 3.5rem 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ─── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 0.75rem 1rem; }
      .brand h1 { font-size: 1.2rem; }
      .brand .dates { display: none; }
      main { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <h1>Tradidanças 2026</h1>
        <span class="dates">29 Jul — 2 Ago</span>
      </div>
      <div class="header-buttons">
        <!-- Theme toggle -->
        <button class="btn-icon" id="themeToggle" title="Alternar modo claro/escuro" aria-label="Alternar tema">
          <svg id="iconDark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="iconLight" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>

        <a href="events.json" class="btn-action" target="_blank" title="Abrir events.json">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          JSON
        </a>

        <a href="tradidancas2026.ics" class="btn-action btn-primary" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download .ICS
        </a>
      </div>
    </div>
  </header>

  <main>
    <!-- Unofficial disclaimer -->
    <div class="disclaimer-banner" role="note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <div>
        Este programa <strong>não é oficial</strong>. É uma ferramenta independente criada com base na programação pública. Para informações oficiais, consulte <a href="https://tradidancas.pt" target="_blank" rel="noopener noreferrer">tradidancas.pt</a>.
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-bar">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Pesquisar por artista, oficina, palco…" autocomplete="off">
      </div>

      <div class="filter-tabs" id="dayTabs" role="tablist">
        <button class="tab-btn active" data-day="all" role="tab">Todos os dias</button>
        <button class="tab-btn" data-day="2026-07-29" role="tab">29 Jul — Qua</button>
        <button class="tab-btn" data-day="2026-07-30" role="tab">30 Jul — Qui</button>
        <button class="tab-btn" data-day="2026-07-31" role="tab">31 Jul — Sex</button>
        <button class="tab-btn" data-day="2026-08-01" role="tab">1 Ago — Sáb</button>
        <button class="tab-btn" data-day="2026-08-02" role="tab">2 Ago — Dom</button>
      </div>

      <div class="sub-filters">
        <select id="stageFilter" class="select-filter" aria-label="Filtrar por local">
          <option value="all">Todos os locais</option>
        </select>
        <select id="catFilter" class="select-filter" aria-label="Filtrar por categoria">
          <option value="all">Todas as categorias</option>
        </select>
      </div>
    </div>

    <div class="stats-bar">
      <span id="eventsCount">A carregar…</span>
      <span>São Pedro do Sul</span>
    </div>

    <div class="events-grid" id="eventsGrid" role="list"></div>
  </main>

  <script>
    /* ── Theme ── */
    const html = document.documentElement;
    const stored = localStorage.getItem('tradi-theme');
    if (stored) html.setAttribute('data-theme', stored);

    const iconDark  = document.getElementById('iconDark');
    const iconLight = document.getElementById('iconLight');

    function syncThemeIcons() {
      const isDark = html.getAttribute('data-theme') === 'dark';
      iconDark.style.display  = isDark ? 'block' : 'none';
      iconLight.style.display = isDark ? 'none'  : 'block';
    }
    syncThemeIcons();

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('tradi-theme', next);
      syncThemeIcons();
    });

    /* ── Data & state ── */
    let eventsData = [];

    const dayLabels = {
      '2026-07-29': 'Qua, 29 Jul',
      '2026-07-30': 'Qui, 30 Jul',
      '2026-07-31': 'Sex, 31 Jul',
      '2026-08-01': 'Sáb, 1 Ago',
      '2026-08-02': 'Dom, 2 Ago',
      '2026-08-03': 'Seg, 3 Ago'
    };

    let currentDay   = 'all';
    let currentStage = 'all';
    let currentCat   = 'all';
    let searchQuery  = '';
    let autoScrolled = false;

    /* Reference clock — use real time if inside festival window */
    const now = new Date();
    const isFestival =
      (now.getFullYear() === 2026) &&
      ((now.getMonth() === 6 && now.getDate() >= 29) ||
       (now.getMonth() === 7 && now.getDate() <= 3));
    const refNow = isFestival ? now : new Date('2026-07-29T13:12:00');

    function parseEventDt(dateStr, timeStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const [h, min]  = timeStr.split(':').map(Number);
      return new Date(y, m - 1, d, h, min, 0);
    }

    /* ── Populate dropdowns ── */
    function initFilters() {
      const stages = new Set();
      const cats   = new Set();
      eventsData.forEach(ev => { stages.add(ev.loc); cats.add(ev.cat); });

      const stageEl = document.getElementById('stageFilter');
      [...stages].sort().forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        stageEl.appendChild(o);
      });

      const catEl = document.getElementById('catFilter');
      [...cats].sort().forEach(c => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        catEl.appendChild(o);
      });
    }

    function getParam(p) {
      return new URLSearchParams(window.location.search).get(p);
    }

    /* ── Render ── */
    function renderEvents() {
      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = '';

      const targetId = getParam('event');

      const filtered = eventsData.filter(ev => {
        if (currentDay   !== 'all' && ev.date !== currentDay)   return false;
        if (currentStage !== 'all' && ev.loc  !== currentStage) return false;
        if (currentCat   !== 'all' && ev.cat  !== currentCat)   return false;
        if (searchQuery) {
          const q = searchQuery;
          return ev.title.toLowerCase().includes(q) ||
                 ev.desc.toLowerCase().includes(q)  ||
                 ev.loc.toLowerCase().includes(q);
        }
        return true;
      });

      document.getElementById('eventsCount').textContent =
        `${filtered.length} evento${filtered.length !== 1 ? 's' : ''}`;

      if (!filtered.length) {
        grid.innerHTML = '<div class="no-results">Nenhum evento encontrado com os filtros seleccionados.</div>';
        return;
      }

      let scrollTarget = null;
      let sharedTarget = null;

      filtered.forEach((ev, idx) => {
        const evId  = `evt-${idx + 1}`;
        const card  = document.createElement('div');
        card.className = 'event-card';
        card.id        = evId;
        card.setAttribute('data-cat', ev.cat || '');
        card.setAttribute('role', 'listitem');

        const start   = parseEventDt(ev.date, ev.start);
        const end     = parseEventDt(ev.date, ev.end);
        const isPast  = end   < refNow;
        const isNow   = start <= refNow && refNow <= end;

        if (isPast) card.classList.add('is-past');
        if (isNow)  {
          card.classList.add('is-current');
          if (!scrollTarget) scrollTarget = card;
        } else if (!isPast && !scrollTarget) {
          scrollTarget = card;
        }

        if (targetId === evId || targetId === String(idx + 1)) {
          card.classList.add('expanded');
          sharedTarget = card;
        }

        card.innerHTML = `
          <div class="event-header">
            <span class="event-time">
              ${ev.start} – ${ev.end}
              ${isNow ? '<span class="live-badge">Em curso</span>' : ''}
            </span>
            <span class="event-date-badge">${dayLabels[ev.date] || ev.date}</span>
          </div>
          <div class="event-title">
            <span>${ev.title}</span>
            <span class="toggle-icon" aria-hidden="true">▾</span>
          </div>
          <div class="event-footer">
            <span class="event-location">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${ev.loc}
            </span>
            <span class="event-cat">${ev.cat}</span>
          </div>
          <div class="event-desc" aria-hidden="${card.classList.contains('expanded') ? 'false' : 'true'}">
            <p>${ev.desc}</p>
            ${ev.url ? `<a href="${ev.url}" target="_blank" rel="noopener" class="official-link" onclick="event.stopPropagation()">
              Ver na página oficial ↗
            </a>` : ''}
          </div>
        `;

        card.addEventListener('click', () => {
          const expanding = !card.classList.contains('expanded');
          // Collapse others
          document.querySelectorAll('.event-card.expanded').forEach(c => {
            if (c !== card) {
              c.classList.remove('expanded');
              c.querySelector('.event-desc').setAttribute('aria-hidden', 'true');
            }
          });
          card.classList.toggle('expanded', expanding);
          card.querySelector('.event-desc').setAttribute('aria-hidden', String(!expanding));

          const url = new URL(window.location);
          if (expanding) url.searchParams.set('event', evId);
          else           url.searchParams.delete('event');
          history.pushState(null, '', url);
        });

        grid.appendChild(card);
      });

      /* Auto-scroll: shared link wins, then current/next event */
      if (!autoScrolled) {
        autoScrolled = true;
        const target = sharedTarget || scrollTarget;
        if (target) {
          setTimeout(() => {
            const y = target.getBoundingClientRect().top +
                      (window.pageYOffset || document.documentElement.scrollTop) -
                      window.innerHeight * 0.25;
            window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
          }, 250);
        }
      }
    }

    /* ── Load data ── */
    fetch('events.json')
      .then(r => r.json())
      .then(data => {
        eventsData = data;
        initFilters();
        renderEvents();
      })
      .catch(() => {
        document.getElementById('eventsGrid').innerHTML =
          '<div class="no-results">Erro ao carregar events.json.</div>';
      });

    /* ── Filter listeners ── */
    document.getElementById('dayTabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('#dayTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDay = btn.dataset.day;
      renderEvents();
    });

    document.getElementById('stageFilter').addEventListener('change', e => {
      currentStage = e.target.value;
      renderEvents();
    });

    document.getElementById('catFilter').addEventListener('change', e => {
      currentCat = e.target.value;
      renderEvents();
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderEvents();
    });
  </script>
</body>
</html>
